[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sperner"
version = "0.4.2"
description = "Constructive fixed-point theorems in Python: Sperner, Brouwer, Hex, Nash, Tucker, and envy-free division"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oussama Mesbah", email = "27909183+OussamaMesbah@users.noreply.github.com" }]
keywords = [
    "fair-division",
    "rent-division",
    "envy-free",
    "rental-harmony",
    "cake-cutting",
    "chore-division",
    "sperner-lemma",
    "fixed-point",
    "brouwer",
    "nash-equilibrium",
    "borsuk-ulam",
    "game-theory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.40"]
benchmark = ["numpy>=1.26", "scipy>=1.11"]
dev = ["numpy>=1.26", "scipy>=1.11", "pytest>=8", "ruff>=0.6", "openai-agents>=0.22"]

[project.urls]
Repository = "https://github.com/OussamaMesbah/sperner"
Issues = "https://github.com/OussamaMesbah/sperner/issues"

[tool.hatch.build.targets.wheel]
packages = ["sperner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
