name: Bug report
description: Something does not work, or a split looks unfair
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please report security problems privately
        instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run or click, what did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A few lines of Python, or what you entered in the web app (rooms, rent, precision).
      render: python
  - type: input
    id: version
    attributes:
      label: Version
      description: 'The output of `python -c "import sperner; print(sperner.__version__)"`, or "web app".'
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
