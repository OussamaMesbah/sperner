name: Feature request
description: Suggest an improvement or a new kind of division
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to divide?
      description: The situation, the people involved and what makes it hard.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine sperner could do it, and a paper if there is one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
